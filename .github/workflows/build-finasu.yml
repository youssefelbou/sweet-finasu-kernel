name: Build FinaSU Personal Kernel (sweet)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-kernel:
    name: Build Kernel
    runs-on: ubuntu-22.04
    steps:
      - name: Build FinaSU Kernel
        uses: dabao1955/kernel_build_action@main
        with:
          kernel-url: https://github.com/LineageOS/android_kernel_xiaomi_sm6150
          kernel-branch: lineage-21
          arch: arm64
          config: vendor/sdmsteppe-perf_defconfig
          merge-configs: '["arch/arm64/configs/vendor/sweet.config"]'
          ksu: true
          ksu-url: https://github.com/LyraVoid/FinaSU
          ksu-branch: main
          anykernel3: true
          release: true
          extra-cmd: |
            KSU_REQUIRE_PREINIT=1
